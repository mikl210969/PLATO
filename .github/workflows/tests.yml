name: PLATO Integration & Chaos Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Run Critical Chaos Scenarios
      run: |
        echo "🚀 Running Scenario 5, 8, 9, 10 (Integration)..."
        pytest tests/test_integration_chaos.py -v --tb=short
        
        echo "🚀 Running Bus Message Loss Tests..."
        pytest tests/test_bus_message_loss.py -v --tb=short
        
        echo "🚀 Running Position Lifecycle Tests..."
        pytest tests/test_position_lifecycle.py -v --tb=short
        
        echo "🚀 Running Real Conditions Chaos Tests..."
        pytest tests/test_chaos_real_conditions.py -v --tb=short
    
    - name: Run All Tests (Final Check)
      run: |
        echo "🏁 Running full test suite..."
        pytest tests/ -v --tb=short